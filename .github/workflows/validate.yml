name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (vet / test / build) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest and windows-latest are real machines, so use them for the
        # checks that cannot run anywhere else: TestPlistIsWellFormed shells out to
        # plutil, which is what launchd itself validates with, and is the closest
        # thing to "would macOS accept this file" without owning a Mac.
        #
        # The generators themselves (plist, task XML) are deliberately untagged and
        # unit-tested on every platform — see darwinplist.go and windowstask.go.
        #
        # Still not covered: actually loading the agent or the task. The schtasks
        # round-trip is opt-in (BITS_WIFI_TEST_SCHTASKS=1) because it registers a
        # real task, and launchctl needs a GUI session a headless runner lacks.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile (windows/amd64)
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  bootstrap:
    name: Bootstrap scripts (shellcheck / shfmt / PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: sudo apt-get install -y shfmt

      - name: Syntax check (bash -n)
        run: bash -n install.sh

      - name: Lint (shellcheck)
        run: shellcheck install.sh

      - name: Format check (shfmt)
        run: shfmt -d -i 4 install.sh

      - name: Syntax check (PowerShell AST)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "install.ps1 parsed OK." -ForegroundColor Green

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no issues." -ForegroundColor Green
